name: Update Streak Stats

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Readme Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=suyashsahu00&theme=tokyonight&fire=70A5FD&ring=70A5FD
          path: streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git commit -m "chore: update streak stats [skip ci]" || exit 0
          git push
